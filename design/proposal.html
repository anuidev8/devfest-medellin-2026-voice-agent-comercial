<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Proposal</title>
<style>
  :root { --bg: #f7f6f3; --surface: #ffffff; --text: #1a1a1a; --muted: #6b6b6b; --line: #e6e3dd; --chip: #efece6; --ok: #1f7a4d; --warn: #9a5b00; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121212; --surface: #1c1c1c; --text: #f1f1f1; --muted: #a0a0a0; --line: #2c2c2c; --chip: #262626; --ok: #5fd39a; --warn: #f0b354; }
  }
  :root[data-theme="dark"] { --bg: #121212; --surface: #1c1c1c; --text: #f1f1f1; --muted: #a0a0a0; --line: #2c2c2c; --chip: #262626; --ok: #5fd39a; --warn: #f0b354; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 48px 16px 96px; }
  nav { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 2; }
  nav div { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; overflow-x: auto; font-size: .9rem; white-space: nowrap; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover, nav a:focus-visible { color: var(--text); }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.8rem); line-height: 1.03; margin: 0 0 16px; letter-spacing: -.02em; }
  h2 { font-size: 1.4rem; margin: 64px 0 16px; scroll-margin-top: 56px; }
  .story { font-size: 1.15rem; max-width: 62ch; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid currentColor; }
  .badge.ok { color: var(--ok); } .badge.wait { color: var(--warn); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .sw { display: flex; gap: 14px; align-items: center; }
  .sw .c { width: 56px; height: 56px; border-radius: 12px; border: 1px solid var(--line); flex: none; }
  .sw b { display: block; } .sw small { color: var(--muted); display: block; }
  .preview { border-radius: 14px; padding: 28px; border: 1px solid var(--line); margin-top: 14px; }
  .preview .btn { display: inline-block; padding: 10px 20px; border-radius: 999px; font-weight: 600; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
  .scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .demo { width: 44px; height: 44px; border-radius: 50%; background: var(--text); opacity: .85; cursor: pointer; border: 0; }
  .demo:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: .82rem; }
  ul { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .spec { margin: 0 0 6px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<nav><div id="nav"></div></nav>
<main id="app"></main>
<script>
const DATA = {"project":"Test Design Skill - Commercial Voice Agent","version":1,"approved":true,"direction":{"name":"Bioluminescent Pulse & Deep Surface","story":"A celestial voice presence balanced with tactile enterprise glass surfaces. Brings commercial voice AI to life through ambient responsiveness and disciplined metrics."},"colors":[{"token":"bg","hex":"#00041B","usage":"page background","contrast":"16.8:1 with text"},{"token":"surface","hex":"#081524","usage":"cards, modular containers","contrast":"13.2:1 with text"},{"token":"surface-elevated","hex":"#0F2238","usage":"hover states and interactive panels"},{"token":"line","hex":"#182C4A","usage":"card borders, subtle grid dividers"},{"token":"text","hex":"#F0F4FD","usage":"headings and primary text"},{"token":"muted","hex":"#728FC4","usage":"secondary metrics, subtitles, labels"},{"token":"accent","hex":"#376CF6","usage":"primary action buttons, active indicator"},{"token":"accent-glow","hex":"#8284F9","usage":"ambient light halo, audio reactive pulses"},{"token":"accent-ink","hex":"#FFFFFF","usage":"text inside accent buttons"},{"token":"status-online","hex":"#10B981","usage":"live connection indicator"},{"token":"status-listening","hex":"#38BDF8","usage":"user speaking state"},{"token":"status-speaking","hex":"#818CF8","usage":"agent speaking state"}],"darkColors":[],"typography":{"display":{"family":"Inter, system-ui, sans-serif","weights":[600,700],"use":"headings and major statistics"},"body":{"family":"Inter, system-ui, sans-serif","weights":[400,500],"use":"descriptions and UI controls"},"mono":{"family":"JetBrains Mono, ui-monospace, monospace","weights":[400,500],"use":"telemetry, latencies, timestamps"},"scale":[{"token":"display","size":"clamp(2.25rem, 5vw, 3.5rem)","lineHeight":1.1},{"token":"h2","size":"clamp(1.5rem, 3vw, 2.25rem)","lineHeight":1.2},{"token":"h3","size":"1.25rem","lineHeight":1.3},{"token":"body","size":"1rem","lineHeight":1.5},{"token":"small","size":"0.875rem","lineHeight":1.4},{"token":"mono","size":"0.8125rem","lineHeight":1.4}]},"spacing":"4px base: 4, 8, 12, 16, 20, 24, 32, 40, 48, 64","radius":[{"token":"card","value":"16px"},{"token":"pill","value":"9999px"},{"token":"control","value":"10px"}],"elevation":"0 0 35px -5px rgba(55, 108, 246, 0.25), 0 8px 32px 0 rgba(0, 0, 0, 0.37)","motion":[{"name":"orb-breathing","meaning":"Voice agent is actively connected, idling in ready state","trigger":"constant when connected","properties":"scale 0.98 → 1.02, box-shadow pulse","duration":"3000ms","easing":"ease-in-out","reducedMotion":"subtle opacity pulse only"},{"name":"speech-ripple","meaning":"Active voice transmission and real-time synthesis","trigger":"agent speaking or user voice detected","properties":"nested rings expanding outward, scale 1.0 → 1.4, opacity 0.8 → 0","duration":"1400ms","easing":"cubic-bezier(0.16, 1, 0.3, 1)","reducedMotion":"instant ring appearance"},{"name":"card-hover-lift","meaning":"Interactive surface readiness feedback","trigger":"card hover or keyboard focus","properties":"translateY -2px, border-color #182C4A → #376CF6","duration":"200ms","easing":"ease-out","reducedMotion":"border-color shift only"}],"interactions":[{"name":"Mic Toggle Interaction","trigger":"click on microphone pill or press Space","feedback":"Orb ignites into vibrant blue aura, status changes from Ready to Listening","state":"active call live"},{"name":"Audio Mode Switch","trigger":"select mode (e.g. Sales, Support, Consultation)","feedback":"Smooth crossfade of conversation prompts and active model profile","state":"mode updated"}],"components":[{"name":"LuminescentVoiceOrb","description":"Interactive multi-ring glowing 3D-effect sphere responding to idle, listening, and speaking states"},{"name":"MetricCard","description":"Clean dark enterprise card displaying live latency, active sessions, and speech recognition confidence"},{"name":"LiveTranscriptStream","description":"Streaming conversation bubble list with agent vs user differentiation and timestamps"},{"name":"AudioControlBar","description":"Floating pill bar with mic toggle, audio input select, volume VU meter, and end-call action"}],"screens":[{"name":"Main Test Design Console","description":"Single-view command center featuring the glowing voice orb as hero center, flanked by enterprise telemetry metrics and a real-time transcript audit feed."}],"dos":["Keep backgrounds deep ink/sapphire (#00041B) to let the glowing sphere pop with clarity.","Use 1px border highlights (#182C4A) with subtle backdrop blurs.","Ensure all telemetry metrics use mono font for tabular alignment."],"donts":["Do not use multi-colored rainbow neon glows; restrict accents to azure (#376CF6) and lavender-indigo (#8284F9).","Do not clutter the focal area around the sphere.","Do not omit reduced-motion fallbacks for glowing animations."],"_context":{"sources":{"fetchedAt":"2026-11-06T17:28:40.933Z","pins":[{"id":"01","file":"01-hrms-software-software-company-website-d.jpg","sourceType":"pinterest-pin","inputUrl":"https://co.pinterest.com/pin/1119918632360360336/","pinUrl":"https://co.pinterest.com/pin/1119918632360360336/","imageUrl":"https://i.pinimg.com/originals/85/57/38/8557385f308e73622bc46901c6640bc3.jpg","title":"Hrms software | Software company website design, Marketing dashboard, Ui animation","description":"Jul 20, 2026 — A digital interface for HRM, featuring sections related to payroll and benefits, hiring in Mexico across various industries, HR & employee management, operational work resources, and legal & compliance assurance. The design includes icons and text, with a color scheme dominated by shades of blue.","originalSource":"https://www.instagram.com/p/DWW9FPtEXEi/","palette":[{"hex":"#091624","share":0.51},{"hex":"#182c4a","share":0.22},{"hex":"#153b81","share":0.17},{"hex":"#1e51b9","share":0.1},{"hex":"#728fc4","share":0.01},{"hex":"#c8d4ed","share":0}]},{"id":"02","file":"02-blue-glowing-sphere-motion-design-acotar.jpg","sourceType":"pinterest-pin","inputUrl":"https://co.pinterest.com/pin/51017408272106975/","pinUrl":"https://co.pinterest.com/pin/51017408272106975/","imageUrl":"https://i.pinimg.com/originals/1b/c6/00/1bc6007a60060ac6fb1c131c06df13e3.jpg","title":"Blue Glowing Sphere Motion Design | Acotar fanart cassian, Cassian as your mate, Acotar characters cassian","description":"A mesmerizing blue circular object glowing in the dark, perfect for futuristic backgrounds, motion design animations, and phone wallpaper designs. Blue sphere, Hologram video, Optical illusions","originalSource":null,"palette":[{"hex":"#000427","share":0.6},{"hex":"#082096","share":0.18},{"hex":"#010f5e","share":0.1},{"hex":"#1342d2","share":0.07},{"hex":"#376cf6","share":0.04},{"hex":"#8284f9","share":0.01}]}],"failed":[]},"ratings":{"brief":"Modern high-converting design test page showcasing a commercial voice AI agent with living audio feedback and clean metrics","top":2,"weights":{"fit":0.3,"hierarchy":0.15,"color":0.15,"type":0.1,"originality":0.15,"build":0.15},"rated":[{"file":"02-blue-glowing-sphere-motion-design-acotar.jpg","scores":{"fit":9,"hierarchy":9,"color":9,"type":7,"originality":9,"build":8},"total":8.6,"borrow":"Luminescent floating blue acoustic sphere as primary voice agent indicator","reason":"Perfect emotional match for living voice agent feedback; rich dark sapphire contrast and radiant energy."},{"file":"01-hrms-software-software-company-website-d.jpg","scores":{"fit":8,"hierarchy":8,"color":8,"type":8,"originality":7,"build":9},"total":8,"borrow":"Modular card hierarchy, crisp dark UI surface cards, and metric status tags","reason":"Provides structured enterprise commercial layout and dashboard clarity to balance the glowing orb."}],"selected":["02-blue-glowing-sphere-motion-design-acotar.jpg","01-hrms-software-software-company-website-d.jpg"],"rejected":[],"swaps":[],"approved":false},"moodboard":{"project":"Test Design Skill - Commercial Voice Agent","direction":{"name":"Bioluminescent Pulse & Deep Surface","story":"An immersive enterprise interface pairing a vibrant celestial acoustic sphere with disciplined, dark-sapphire glass cards. It makes voice intelligence tactile and alive while maintaining high commercial clarity.","blend":"55% 02-blue-glowing-sphere, 45% 01-hrms-software"},"refs":[{"file":"02-blue-glowing-sphere-motion-design-acotar.jpg","contributes":"Radiant multi-ring acoustic sphere, dark cosmos depth, pulsing light states"},{"file":"01-hrms-software-software-company-website-d.jpg","contributes":"Modular card hierarchy, crisp dark UI surface cards, enterprise metric chips"}],"palette":[{"role":"bg","hex":"#00041B","from":"02-blue-glowing-sphere-motion-design-acotar.jpg"},{"role":"surface","hex":"#091624","from":"01-hrms-software-software-company-website-d.jpg"},{"role":"surface-border","hex":"#182C4A","from":"01-hrms-software-software-company-website-d.jpg"},{"role":"text","hex":"#F0F4FD","from":"01-hrms-software-software-company-website-d.jpg"},{"role":"muted","hex":"#728FC4","from":"01-hrms-software-software-company-website-d.jpg"},{"role":"accent-primary","hex":"#376CF6","from":"02-blue-glowing-sphere-motion-design-acotar.jpg"},{"role":"accent-glow","hex":"#8284F9","from":"02-blue-glowing-sphere-motion-design-acotar.jpg"}],"type":{"display":{"family":"Inter / Plus Jakarta Sans","why":"Precise, modern geometric sans that projects authority without stiffness"},"body":{"family":"Inter","why":"Ultra-clean readability on high-contrast dark surfaces"},"mono":{"family":"JetBrains Mono / monospace","why":"Technical clarity for latency, timestamps, and audio sample rates"}},"shape":{"radius":"16px on content cards, full pills on status chips and interactive controls","depth":"Subtle 1px border glows (#182C4A) with deep blue radial underglows behind key elements","texture":"Atmospheric soft radial glow behind the primary sphere; no distracting background patterns","imagery":"Reactive acoustic light waveforms, live circular audio visualization, enterprise metric badges"},"feel":["radiant","intelligent","calm-focused","enterprise-grade","tactile"],"motionKeywords":["breathing pulse","fluid ripple","smooth state shifts"],"rejectedLooks":["chaotic neon cyberpunk gradients","flat white generic templates","cluttered desktop toolbars"]},"pinsDir":"pins"}};
const d = DATA || {};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dir = d.direction || {};
document.title = (dir.name || "Design") + " · Proposal";

const fams = [d.typography?.display?.family, d.typography?.body?.family].filter(Boolean);
if (fams.length) {
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?" + fams.map((f) => "family=" + encodeURIComponent(f) + ":wght@400;500;600").join("&") + "&display=swap";
  document.head.appendChild(l);
}

const col = Object.fromEntries((d.colors || []).map((c) => [c.token, c.hex]));
const swatches = (list) => (list || []).map((c) => `<div class="card sw"><div class="c" style="background:${esc(c.hex)}"></div>
  <div><b>${esc(c.token)}</b><small><code>${esc(c.hex)}</code></small><small>${esc(c.usage || "")}</small>${c.contrast ? `<small>contrast ${esc(c.contrast)}</small>` : ""}</div></div>`).join("");

const disp = d.typography?.display, body = d.typography?.body;
const preview = `<div class="preview" style="background:${esc(col.bg || "#fff")};color:${esc(col.text || "#111")}">
  <div style="font-family:'${esc(disp?.family || "serif")}',serif;font-size:2rem;line-height:1.1">${esc(dir.name || "Headline")}</div>
  <p style="font-family:'${esc(body?.family || "sans-serif")}',sans-serif;color:${esc(col.muted || col.text || "#555")};max-width:48ch">${esc(dir.story || "")}</p>
  <span class="btn" style="background:${esc(col.accent || "#333")};color:${esc(col["accent-ink"] || "#fff")}">Primary action</span>
</div>`;

const scale = (d.typography?.scale || []).map((s) => `<tr><td><b>${esc(s.token)}</b></td><td><code>${esc(s.size)}</code></td><td>${esc(s.lineHeight ?? "")}</td>
  <td style="font-family:'${esc((/display|h\d/.test(s.token) ? disp : body)?.family || "inherit")}';font-size:min(${esc(s.size)}, 2.6rem);line-height:1.1">Aa Breathe</td></tr>`).join("");

const parseMs = (v) => { const m = String(v || "").match(/([\d.]+)\s*(ms|s)?/); if (!m) return 400; return m[2] === "s" ? +m[1] * 1000 : +m[1]; };
const easing = (v) => /cubic-bezier|ease|linear|steps/.test(v || "") ? v : "ease";
const motion = (d.motion || []).map((m, i) => `<tr>
  <td><button class="demo" data-i="${i}" aria-label="Play ${esc(m.name)}"></button></td>
  <td><b>${esc(m.name)}</b><div class="muted">${esc(m.meaning)}</div></td>
  <td>${esc(m.trigger)}</td><td>${esc(m.properties)}</td>
  <td><code>${esc(m.duration)}</code><br><code style="font-size:.8rem">${esc(m.easing)}</code></td>
  <td>${esc(m.reducedMotion)}</td></tr>`).join("");

const interactions = (d.interactions || []).map((x) => `<div class="card">
  <b>${esc(x.name)}</b>
  <p class="spec"><span class="muted">Trigger</span> — ${esc(x.trigger)}</p>
  <p class="spec"><span class="muted">Feedback</span> — ${esc(x.feedback)}</p>
  <p class="spec"><span class="muted">End state</span> — ${esc(x.endState)}</p>
  ${x.motion ? `<p class="spec"><span class="muted">Motion</span> — ${esc(x.motion)}</p>` : ""}
  ${x.why ? `<p class="spec muted" style="margin-top:8px">${esc(x.why)}</p>` : ""}</div>`).join("");

const components = (d.components || []).map((c) => `<div class="card"><b>${esc(c.name)}</b>
  ${(c.variants || []).length ? `<p class="spec muted">${c.variants.map(esc).join(" · ")}</p>` : ""}
  <div class="chips">${(c.states || []).map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div></div>`).join("");

const screens = (d.screens || []).map((s) => `<div class="card"><b>${esc(s.name)}</b><p class="spec">${esc(s.layout)}</p></div>`).join("");
const list = (a) => `<ul>${(a || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;

const sections = [
  ["colors", "Colors", `<div class="cards">${swatches(d.colors)}</div>${preview}${(d.darkColors || []).length ? `<h3>Dark mode</h3><div class="cards">${swatches(d.darkColors)}</div>` : ""}`],
  ["type", "Typography", `<p>${esc(disp?.family)} (${esc(disp?.use || "display")}) · ${esc(body?.family)} (${esc(body?.use || "body")})</p><div class="scroll"><table><thead><tr><th>Token</th><th>Size</th><th>Line</th><th>Sample</th></tr></thead><tbody>${scale}</tbody></table></div>`],
  ["layout", "Spacing, radius, elevation", `<div class="card"><p class="spec"><span class="muted">Spacing</span> — ${esc(d.spacing)}</p><p class="spec"><span class="muted">Radius</span> — ${(d.radius || []).map((r) => esc(r.token + " " + r.value)).join(" · ")}</p><p class="spec"><span class="muted">Elevation</span> — ${esc(d.elevation)}</p></div>`],
  ["motion", "Motion meanings", `<p class="muted">Press a dot to preview the timing.</p><div class="scroll"><table><thead><tr><th></th><th>Motion</th><th>Trigger</th><th>What moves</th><th>Timing</th><th>Reduced motion</th></tr></thead><tbody>${motion}</tbody></table></div>`],
  ["interactions", "Interaction concepts", `<div class="cards">${interactions}</div>`],
  ["components", "Components", `<div class="cards">${components}</div>`],
  ["screens", "Key screens", `<div class="cards">${screens}</div>`],
  ["rules", "Do / Don't", `<div class="two"><div class="card"><b>Do</b>${list(d.do)}</div><div class="card"><b>Don't</b>${list(d.dont)}</div></div>`],
];

document.getElementById("nav").innerHTML = sections.map(([id, t]) => `<a href="#${id}">${t}</a>`).join("");
document.getElementById("app").innerHTML = `
  <p class="eyebrow">${esc(d.project || "")} · Design proposal v${esc(d.version || 1)}</p>
  <h1>${esc(dir.name || "Untitled direction")}</h1>
  <p class="story">${esc(dir.story || "")}</p>
  <span class="badge ${d.approved ? "ok" : "wait"}">${d.approved ? "Approved" : "Waiting for approval"}</span>
  ${sections.map(([id, t, html]) => `<h2 id="${id}">${t}</h2>${html}`).join("")}`;

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.querySelectorAll(".demo").forEach((b) => b.addEventListener("click", () => {
  const m = d.motion[+b.dataset.i];
  const frames = reduce ? [{ opacity: .2 }, { opacity: .85 }] : [{ transform: "scale(.6)", opacity: .2 }, { transform: "scale(1)", opacity: .85 }];
  b.animate(frames, { duration: Math.min(parseMs(m.duration), 6000), easing: easing(m.easing) });
}));
</script>
</body>
</html>
