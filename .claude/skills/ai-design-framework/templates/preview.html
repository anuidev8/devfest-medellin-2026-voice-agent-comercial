<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Direction Name] · Preview</title>
<!--
  PREVIEW STARTER — the agent copies this to design/preview.html and replaces everything marked [ ].
  Rules:
  - One self-contained file. Only external loads allowed: Google Fonts + design/tokens.css (generated).
  - Use ONLY token variables for color, type, radius, shadow, duration, easing. No raw hex in the page CSS.
  - Real copy from soul.md. No lorem ipsum.
  - Every animated element gets data-motion="<name from proposal.motion>".
  - Every interactive concept gets data-interaction="<name from proposal.interactions>".
  - Add data-note="..." to explain any decision a reviewer or a later agent should know.
  - Keep the toolbar and the #design-spec block; they make the preview readable by people AND agents.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=[Display+Font]:wght@400;600&family=[Body+Font]:wght@400;500&display=swap">
<!-- Generated by: node <skill>/scripts/tokens-to-css.mjs design/design-tokens.json design/tokens.css --plain -->
<link rel="stylesheet" href="tokens.css">
<style>
  /* ---------- Preview harness (keep) ---------- */
  html.reduce *, html.reduce *::before, html.reduce *::after {
    animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important;
  }
  #stage { margin: 0 auto; transition: max-width .3s ease; }
  html[data-width="390"] #stage { max-width: 390px; box-shadow: 0 0 0 1px rgb(127 127 127 / .3); }
  html[data-width="768"] #stage { max-width: 768px; box-shadow: 0 0 0 1px rgb(127 127 127 / .3); }
  html.notes [data-motion], html.notes [data-interaction], html.notes [data-note] { outline: 1.5px dashed #ff3b8d; outline-offset: 3px; position: relative; }
  html.notes [data-motion]::after, html.notes [data-interaction]::after, html.notes [data-note]::after {
    content: attr(data-motion) " " attr(data-interaction) " " attr(data-note);
    position: absolute; left: 0; top: -1.6em; z-index: 50; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    font: 600 11px/1.6 ui-monospace, monospace; background: #ff3b8d; color: #fff; padding: 0 6px; border-radius: 4px; pointer-events: none;
  }
  #harness {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 100; display: flex; gap: 4px; padding: 6px;
    background: rgb(20 20 20 / .88); backdrop-filter: blur(8px); border-radius: 999px; font: 500 13px/1 system-ui, sans-serif;
    max-width: calc(100vw - 32px); overflow-x: auto;
  }
  #harness button { all: unset; cursor: pointer; color: #ddd; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  #harness button[aria-pressed="true"] { background: #fff; color: #111; }
  #harness button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---------- Page styles (replace) — tokens only ---------- */
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .hero { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px 16px 96px; }
  .hero h1 { font-family: var(--font-display); font-size: var(--text-display); margin: 0 0 16px; }
  .hero p { color: var(--color-muted); max-width: 52ch; margin: 0 auto 24px; }
  .cta {
    display: inline-block; padding: 14px 28px; border-radius: var(--radius-pill); background: var(--color-accent); color: var(--color-accent-ink);
    text-decoration: none; font-weight: 600; transition: transform var(--duration-fast) var(--ease-out);
  }
  .cta:hover { transform: translateY(-2px); }
  .cta:active { transform: scale(.97); }
  .cta:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }
  .fade-up { animation: fade-up var(--duration-slow) var(--ease-out) both; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } }
</style>
</head>
<body>
<div id="stage">
  <!-- ---------- Page (replace with the real first viewport + key sections) ---------- -->
  <section class="hero">
    <div>
      <h1 class="fade-up" data-motion="fade-up">[Headline from soul.md]</h1>
      <p class="fade-up" style="animation-delay:80ms" data-motion="fade-up">[Sub-headline]</p>
      <a class="cta" href="#" data-interaction="[interaction name]">[CTA label]</a>
    </div>
  </section>
</div>

<!-- Machine-readable summary so another agent can build from this preview. Keep in sync with proposal.json. -->
<script type="application/json" id="design-spec">
{
  "direction": "[Direction Name]",
  "tokens": "design/design-tokens.json",
  "motions": ["fade-up"],
  "interactions": ["[interaction name]"],
  "sections": ["hero"],
  "approved": false
}
</script>

<nav id="harness" aria-label="Preview controls">
  <button data-k="theme" aria-pressed="false">Dark</button>
  <button data-k="reduce" aria-pressed="false">Reduced motion</button>
  <button data-k="notes" aria-pressed="false">Design notes</button>
  <button data-k="w" data-v="390" aria-pressed="false">Mobile</button>
  <button data-k="w" data-v="768" aria-pressed="false">Tablet</button>
  <button data-k="w" data-v="full" aria-pressed="true">Desktop</button>
  <button data-k="replay" aria-pressed="false">Replay</button>
</nav>
<script>
  const html = document.documentElement;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) html.classList.add("reduce");
  const sync = () => document.querySelectorAll("#harness button").forEach((b) => {
    const k = b.dataset.k;
    if (k === "theme") b.setAttribute("aria-pressed", html.classList.contains("dark"));
    if (k === "reduce") b.setAttribute("aria-pressed", html.classList.contains("reduce"));
    if (k === "notes") b.setAttribute("aria-pressed", html.classList.contains("notes"));
    if (k === "w") b.setAttribute("aria-pressed", (html.dataset.width || "full") === b.dataset.v);
  });
  document.getElementById("harness").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.k;
    if (k === "theme") { html.classList.toggle("dark"); html.classList.toggle("light", !html.classList.contains("dark")); }
    if (k === "reduce") html.classList.toggle("reduce");
    if (k === "notes") html.classList.toggle("notes");
    if (k === "w") html.dataset.width = b.dataset.v;
    if (k === "replay") document.querySelectorAll("[data-motion]").forEach((el) => {
      el.getAnimations({ subtree: true }).forEach((a) => { a.cancel(); a.play(); });
      el.style.animation = "none"; el.offsetHeight; el.style.animation = "";
    });
    sync();
  });
  sync();
</script>
</body>
</html>
