requires-python = ">=3.10,<3.15"
dependencies = [
  "livekit-agents~=1.8",
  "livekit-plugins-elevenlabs~=1.8",
  "python-dotenv>=1.0",
]

[tool.setuptools]
py-modules = ["agent", "tools", "playbook"]
